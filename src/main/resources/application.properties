spring.data.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/resumebuilder_v2}
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/resumebuilder_v2}
spring.data.mongodb.database=${SPRING_MONGODB_DATABASE:resumebuilder_v2}

app.base.url=${APP_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Load gitignored local overrides when present
spring.config.import=optional:classpath:application-local.properties

# Email (using port 465 with SSL for Render compatibility)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=${SMTP_PORT:465}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.username=${BREVO_SMTP_USER:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.from=${MAIL_FROM:}

# Cloudinary information
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Jwt Information
jwt.secret=${JWT_SECRET:your-secret-key-here-changes-this-in-production-with-more-secure-and-complicated-key}
jwt.expiration=604800000

# Razorpay Information
razorpay.key.id=${RAZORPAY_KEY:}
razorpay.key.secret=${RAZORPAY_SECRET:}
